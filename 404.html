<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Page not found · Sang Min Lee</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/favicon-32.png" />
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        :root { --bg: #f8f7f4; --surface: #fff; --text: #13151a; --text-2: #444a56; --text-3: #767c88; --line: #e5e2db; --accent: #2343c4; --grid: rgba(19,21,26,.055); }
        :root[data-theme="dark"] { --bg: #0b0d11; --surface: #12151b; --text: #eceef3; --text-2: #b4b9c5; --text-3: #7e8593; --line: #222732; --accent: #8fa6ff; --grid: rgba(236,238,243,.045); }
        * { box-sizing: border-box; margin: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 44px 44px;
        }
        main { max-width: 460px; text-align: center; }
        .code { font-family: "Instrument Serif", Georgia, serif; font-size: 7rem; line-height: 1; letter-spacing: -.03em; }
        h1 { margin-top: .75rem; font-size: 1.25rem; font-weight: 650; }
        p { margin-top: .6rem; color: var(--text-2); line-height: 1.6; }
        nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; margin-top: 2rem; }
        a { display: inline-block; padding: .55rem 1rem; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--text); font-size: .9rem; font-weight: 600; text-decoration: none; }
        a:hover { border-color: var(--accent); color: var(--accent); }
        a.primary { background: var(--text); border-color: var(--text); color: var(--bg); }
        a.primary:hover { color: var(--bg); opacity: .9; }
    </style>
</head>
<body>
    <main>
        <div class="code" aria-hidden="true">404</div>
        <h1>This page doesn’t exist</h1>
        <p>The link may be outdated, or the page has moved.</p>
        <nav aria-label="Helpful links">
            <a class="primary" href="/">Home</a>
            <a href="/#publications">Publications</a>
            <a href="/#contact">Contact</a>
        </nav>
    </main>
</body>
</html>
