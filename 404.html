<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Page not found · Sang Min Lee</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/favicon-32.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        :root { --bg: #fff; --text: #18181b; --text-2: #45464d; --text-3: #7a7b83; --line: #e8e8e6; --accent: #1e56a0; }
        :root[data-theme="dark"] { --bg: #111214; --text: #ececee; --text-2: #b9bac1; --text-3: #83848c; --line: #26272b; --accent: #8db4ef; }
        * { box-sizing: border-box; margin: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.7 "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", sans-serif;
            letter-spacing: -0.006em;
            -webkit-font-smoothing: antialiased;
        }
        main { width: 100%; max-width: 440px; }
        .code { font-size: 0.9rem; font-weight: 600; color: var(--text-3); font-variant-numeric: tabular-nums; }
        h1 { margin-top: 6px; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.3; }
        p { margin-top: 10px; color: var(--text-2); }
        nav { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; gap: 20px; font-size: 0.95rem; }
        a { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: 3px; }
        a:hover { text-decoration-color: currentColor; }
    </style>
</head>
<body>
    <main>
        <p class="code">404</p>
        <h1>This page doesn’t exist.</h1>
        <p>The link may be out of date, or the page has moved.</p>
        <nav aria-label="Links">
            <a href="/">Home</a>
            <a href="/#publications">Publications</a>
            <a href="/#contact">Contact</a>
        </nav>
    </main>
</body>
</html>
