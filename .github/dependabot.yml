version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      build-tools:
        patterns:
          - esbuild
          - sharp
          - html-minifier-terser
          - js-yaml
          - marked
          - pretendard
          - subset-font
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
