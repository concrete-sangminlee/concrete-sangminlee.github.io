name: Penguin Volley v3 verification
on: push
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Physics and CPU stress
        run: |
          node --input-type=module <<'NODE'
          import {createWorld,resetRally,placeServe,launchServe,stepWorld} from './apps/penguin-volley/js/physics.js';
          import {createAI,aiInput,aiServeInput} from './apps/penguin-volley/js/ai.js';
          function sim(A,B,seed,maxTouches){const w=createWorld(seed,0);let ai,server=0,rallies=0,f=0,winds=0,faults=0;const reset=()=>{resetRally(w,server);ai=[createAI(0,A,seed+rallies*17+1),createAI(1,B,seed+rallies*19+2)];placeServe(w,server);launchServe(w,server,aiServeInput(ai[server],w));f=0};reset();while(rallies<300){const r=stepWorld(w,[aiInput(ai[0],w),aiInput(ai[1],w)],{maxTouches});f++;for(const e of r.events){if(e.type==='iceWind')winds++;if(e.type==='touchFault')faults++}if(f>3600||![w.ball.x,w.ball.y,w.ball.vx,w.ball.vy].every(Number.isFinite))throw Error(`broken ${A}-${B}`);if(r.scorer>=0){server=r.scorer;rallies++;reset()}}console.log(A,B,maxTouches?'competitive':'arcade',{winds,faults})}
          for(const rules of [0,3])for(const p of [['easy','easy'],['normal','normal'],['hard','hard'],['normal','easy'],['hard','normal']])sim(...p,31,rules);
          NODE
      - name: Browser verification
        run: |
          mkdir -p pv3-artifacts
          cd dist
          python3 -m http.server 8796 >/tmp/pv3-http.log 2>&1 &
          cd ..
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node scripts/tmp-pv3-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: penguin-volley-v3-screenshots
          path: pv3-artifacts
          retention-days: 1
