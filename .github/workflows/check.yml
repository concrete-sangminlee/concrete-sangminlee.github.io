name: Check

# Builds the site on pull requests without deploying: content checks, CV PDFs,
# and a Lighthouse run. The rendered PDFs/images and the whole built site are
# attached to the run as artifacts for review.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # sitemap <lastmod> comes from git history

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run check

      # Headless Chrome prints the PDFs with the same Pretendard the site serves (npm package).
      - name: Install Pretendard
        run: |
          mkdir -p ~/.local/share/fonts
          cp node_modules/pretendard/dist/public/variable/PretendardVariable.ttf ~/.local/share/fonts/
          fc-cache -f

      - run: npm run render

      # Thresholds in lighthouserc.json: accessibility, best practices and SEO 100,
      # CLS <= 0.1 (errors); performance >= 90 (warning). Scores go to the job
      # summary; full reports are linked in the log (temporary public storage).
      - name: Lighthouse
        run: |
          npx --yes @lhci/cli@0.15.1 collect
          node scripts/lighthouse-summary.js
          npx --yes @lhci/cli@0.15.1 upload
          npx --yes @lhci/cli@0.15.1 assert

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rendered
          path: |
            dist/cv/*.pdf
            dist/static/og/*.png
            dist/static/assets/icon-maskable-*.png

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site
          path: dist
          retention-days: 7
