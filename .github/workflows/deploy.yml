name: Build and Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # sitemap <lastmod> comes from git history

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run check

      # CV PDFs, social cards and icons: headless Chrome renders dist/render/** with the
      # same Pretendard the site serves (npm package), so Hangul renders identically.
      - name: Install Pretendard
        run: |
          mkdir -p ~/.local/share/fonts
          cp node_modules/pretendard/dist/public/variable/PretendardVariable.ttf ~/.local/share/fonts/
          fc-cache -f

      - run: npm run render

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
