<!DOCTYPE html>
<html lang="{{lang}}" class="no-js">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="author" content="Sang Min Lee" />
    <meta name="robots" content="index, follow" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; worker-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <script>
        (function () {
            var d = document.documentElement, t = null;
            d.classList.remove('no-js'); d.classList.add('js');
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            d.setAttribute('data-theme', t);
        })();
    </script>

    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:image" content="{{og-image}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{og-image-alt}}" />
    <meta property="og:locale" content="{{og-locale}}" />
    <meta property="og:locale:alternate" content="{{og-locale-alt}}" />
    <meta property="profile:first_name" content="Sang Min" />
    <meta property="profile:last_name" content="Lee" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="{{canonical}}" />
    <link rel="alternate" hreflang="en" href="https://concrete-sangminlee.github.io/" />
    <link rel="alternate" hreflang="ko" href="https://concrete-sangminlee.github.io/ko/" />
    <link rel="alternate" hreflang="x-default" href="https://concrete-sangminlee.github.io/" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="{{root}}manifest.json" />

    <script type="application/ld+json" id="json-ld">{}</script>

    <link rel="icon" type="image/png" sizes="32x32" href="{{root}}static/assets/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{root}}static/assets/apple-touch-icon.png" />

    <!-- Pretendard: one family for Latin and Hangul (dynamic subset, loads only the glyphs a page uses) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

    <!-- INLINE_CSS_HERE: build.js replaces this comment and the link below with an inline style tag -->
    <link rel="stylesheet" href="{{root}}static/css/main.css" />

    <script src="{{root}}static/js/scripts.js" defer></script>
</head>

<body id="top">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/></symbol>
        <symbol id="i-github" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-1.96c-3.2.7-3.87-1.54-3.87-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></symbol>
        <symbol id="i-scholar" viewBox="0 0 24 24"><path d="M22 9.5 12 4.5 2 9.5l10 5 10-5Z"/><path d="M6 11.5v5c3.5 2.6 8.5 2.6 12 0v-5"/></symbol>
        <symbol id="i-orcid" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M8.6 10.2v6.3"/><path d="M8.6 7.5v.01"/><path d="M11.6 7.6h2.1a4.45 4.45 0 0 1 0 8.9h-2.1z"/></symbol>
        <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
        <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M10 3.5 11.7 8.3 16.5 10l-4.8 1.7L10 16.5l-1.7-4.8L3.5 10l4.8-1.7Z"/><path d="M18 14.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9Z"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7Z"/></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
        <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.7-3.7"/></symbol>
    </svg>

    <a class="skip-link" href="#main">{{ui-skip}}</a>

    <header class="site-header" id="site-header">
        <div class="wrap header-inner">
            <a class="brand" href="#top">{{name}}</a>
            <nav aria-label="{{ui-primary}}">
                <ul class="nav-links"><!-- @SLOT:nav --></ul>
            </nav>
            <div class="header-actions">
                <a class="lang-link" href="{{lang-href}}" lang="{{lang-target}}" hreflang="{{lang-target}}" title="{{lang-title}}">{{lang-label}}</a>
                <button class="icon-btn theme-toggle js-only" type="button" aria-label="{{ui-theme}}" title="{{ui-theme}}">
                    <svg class="icon i-sun" aria-hidden="true"><use href="#i-sun"/></svg>
                    <svg class="icon i-moon" aria-hidden="true"><use href="#i-moon"/></svg>
                </button>
                <button class="icon-btn menu-btn js-only" type="button" aria-label="{{ui-menu}}" aria-expanded="false" aria-controls="mobile-nav">
                    <svg class="icon i-menu" aria-hidden="true"><use href="#i-menu"/></svg>
                    <svg class="icon i-close" aria-hidden="true"><use href="#i-close"/></svg>
                </button>
            </div>
        </div>
        <nav class="mobile-nav" id="mobile-nav" aria-label="{{ui-mobile}}" hidden>
            <ul><!-- @SLOT:nav --></ul>
        </nav>
    </header>

    <main id="main">
        <!-- @SLOT:intro -->
        <!-- @SLOT:sections -->
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <div class="row">
                <div></div>
                <div class="footer-inner">
                    <p><span id="copyright-text">{{copyright-text}}</span>. {{footer-updated}}</p>
                    <ul class="footer-links">
                        <li><a href="/blog/">{{footer-blog}}</a></li>
                        <li><a href="{{root}}{{cv-page}}">{{cv-label}}</a></li>
                        <li><a href="{{root}}{{cv2-page}}" lang="{{lang-target}}">{{cv2-label}}</a></li>
                        <li><a href="/sequence-arena/">Sequence Arena</a></li>
                        <li><a href="https://github.com/concrete-sangminlee/concrete-sangminlee.github.io">{{footer-source}}</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <dialog class="modal" id="cite-modal" aria-labelledby="cite-title">
        <div class="modal-head">
            <h2 id="cite-title">{{cite-title}}</h2>
            <button class="icon-btn" type="button" data-close aria-label="{{ui-close}}">
                <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
            </button>
        </div>
        <p class="modal-sub" id="cite-sub"></p>
        <div class="cite-tabs" role="group" aria-label="{{cite-format}}">
            <button class="tab" type="button" data-format="bib" aria-pressed="true">BibTeX</button>
            <button class="tab" type="button" data-format="apa" aria-pressed="false">APA</button>
        </div>
        <pre class="bib" id="cite-bib"></pre>
        <div class="modal-foot">
            <button class="btn" type="button" data-close>{{ui-close}}</button>
            <button class="btn btn-primary" type="button" id="cite-copy" autofocus>{{cite-copy}}</button>
        </div>
    </dialog>

    <script type="application/json" id="bib-data">{}</script>
</body>

</html>
