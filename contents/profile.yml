# CV data: the single source for the homepage, the English CV, and the Korean CV.
#
# Any text field can have a Korean counterpart with the suffix `_ko`
# (title -> title_ko, notes -> notes_ko, ...). The Korean CV uses the `_ko`
# value when present and falls back to the English one otherwise.
#
# Dates are "YYYY-MM" or "YYYY". `end: present` marks an ongoing entry and
# `expected: true` marks a planned end date.
# `cv: false` keeps an entry on the homepage but out of both CVs;
# `web: false` does the opposite.

